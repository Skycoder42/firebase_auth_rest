name: CI/CD

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  ci:
    name: CI
    uses: Skycoder42/dart_test_tools/.github/workflows/dart.yml@main
    with:
      buildRunner: true
      panaScoreThreshold: 10
      unitTestPaths: -P unit
      coverageExclude: >-
        "**/*.g.dart"
        "**/*.freezed.dart"
      integrationTestPaths: -P integration
    secrets:
      integrationTestEnvVars: |
        FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}

  cd:
    name: CD
    uses: Skycoder42/dart_test_tools/.github/workflows/release.yml@main
    needs:
      - ci
    permissions:
      contents: write
      actions: write
    with:
      publishWorkflow: cd.yaml

  renovate:
    name: Renovate
    needs:
      - ci
      - cd
    if: ${{ !cancelled() }}
    uses: Skycoder42/dart_test_tools/.github/workflows/renovate-finish.yml@main
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      needs: ${{ toJSON(needs) }}
